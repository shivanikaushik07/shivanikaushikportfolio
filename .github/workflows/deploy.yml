name: Deploy to GitHub Pages

# Any push to main builds web/ and publishes to GitHub Pages; can also be run by hand
# from the Actions tab
on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissions required to deploy to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; a new push cancels the one in flight
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web # the front-end app lives in web/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build # tsc -b && vite build → web/dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist # relative to the repo root; `uses` steps ignore working-directory

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
